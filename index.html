<!DOCTYPE html>
<html>
  <head>
    <title>Beyond Quest Database</title>

    <style>
      body {
        margin: 0;
        background-color: #f3e8d0;
        font-family: Cambria, serif;
        color: #333;

        /* Keeps footer at the bottom */
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      header {
        background-color: #164a35;
        color: white;
        padding: 25px;
        text-align: center;
      }

      header h1 {
        margin: 0;
      }

      nav {
        background-color: #0f3828;
        padding: 12px;
        text-align: center;
      }

      nav a {
        color: white;
        text-decoration: none;
        margin: 0 15px;
      }

      main {
        padding: 30px;
        max-width: 1000px;
        width: 100%;
        box-sizing: border-box;
        margin: auto;

        /* Pushes footer to the bottom */
        flex: 1;
      }

      .database-box {
        background-color: #fffaf0;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 3px 8px rgba(0, 0, 0, 0.15);
      }

      .database-box h2 {
        color: #164a35;
      }

      footer {
        background-color: #164a35;
        color: white;
        text-align: center;
        padding: 15px;
        margin-top: 40px;
      }

      footer p {
        margin: 0;
      }
    </style>
  </head>

  <body>

    <header>
      <h1>Beyond Quest Database</h1>
      <p>Explore the world of Beyond Quest</p>
    </header>

    <nav>
      <a href="#">Potato Corner</a>
      <a href="#">Pick Up Coffee</a>
      <a href="#">Other Clients</a>
    </nav>

    <main>
      <div class="database-box">
        <h2>Database</h2>

        <!-- Database content can go here -->

      </div>
    </main>

    <footer>
      <p>&copy; Beyond Quest Recruitment Inc</p>
    </footer>

  </body>
</html>
