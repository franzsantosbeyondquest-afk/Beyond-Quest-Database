<!DOCTYPE html>
<html>
  <head>
    <title>Beyond Quest Database</title>

    <style>
      body {
        margin: 0;
        background-color: #f3e8d0;
        font-family: Cambria, serif;
        color: #333;

        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      header {
        background-color: #164a35;
        color: white;
        padding: 25px;
        text-align: center;
      }

      header h1 {
        margin: 0;
      }

      nav {
        background-color: #0f3828;
        padding: 15px;
        display: flex;
        justify-content: center;
        gap: 60px;
      }

      nav a {
        color: white;
        text-decoration: none;
        font-size: 17px;
      }

      nav a:hover {
        text-decoration: underline;
      }

      main {
        padding: 30px;
        max-width: 1000px;
        width: 100%;
        box-sizing: border-box;
        margin: auto;
        flex: 1;
      }

      .database-box {
        background-color: #fffaf0;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 3px 8px rgba(0, 0, 0, 0.15);
      }

      .database-box h2 {
        color: #164a35;
      }

      .client {
        background-color: white;
        padding: 15px;
        margin-top: 15px;
        border-left: 5px solid #164a35;
        border-radius: 5px;
      }

      .client h3 {
        margin-top: 0;
        color: #164a35;
      }

      footer {
        background-color: #164a35;
        color: white;
        text-align: center;
        padding: 15px;
        margin-top: 40px;
      }

      footer p {
        margin: 0;
      }
    </style>
  </head>

  <body>

    <header>
      <h1>Beyond Quest Database</h1>
      <p>Manpower Recruitment Agency</p>
    </header>

    <nav>
      <a href="#">Potato Corner</a>
      <a href="#">Pick Up Coffee</a>
      <a href="#">Other Clients</a>
    </nav>

    <main>
      <div class="database-box">
        <h2>Database</h2>

        <div id="client-list">
          Loading...
        </div>

      </div>
    </main>

    <footer>
      <p>&copy; Beyond Quest Recruitment Inc</p>
    </footer>


    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
      const SUPABASE_URL =
        "https://vgzdvjtuxkjxyobsecvn.supabase.co";

      const SUPABASE_KEY =
        "sb_publishable_KzxoqU3_INc2oQDjmYYCJg_lIkt3GB0";

      const supabase = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


      async function loadClients() {

        const { data, error } = await supabase
          .from("clients")
          .select("*");

        if (error) {
          console.error("Supabase error:", error);

          document.getElementById("client-list").innerHTML =
            "<p>Unable to load database.</p>";

          return;
        }


        const clientList =
          document.getElementById("client-list");


        clientList.innerHTML = data.map(client => `
          <div class="client">

            <h3>${client.name}</h3>

            <p>
              ${client.description || ""}
            </p>

          </div>
        `).join("");
      }


      loadClients();
    </script>

  </body>
</html>
